# Codex project config for metrobank-export.
#
# Only loads when this project is trusted, i.e. ~/.codex/config.toml contains:
#   [projects."/Users/nickpomfret/projects/metrobank-export"]
#   trust_level = "trusted"
#
# Per-command allow/prompt/deny lives in .codex/rules/project.rules

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Writes are confined to this directory tree.
network_access = true
